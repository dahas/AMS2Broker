[launcher]
; Visibility:
; 0 = visible (default)
; 1 = completely invisible
; 2 = Vsible on errors and after patching
silent=2

[game]
; If the Launcher fails finding the EXE: Uncomment the line below and set the right path.
;path_to_exe=C:\Program Files (x86)\Steam\steamapps\common\Automobilista 2\AMS2AVX.exe

[server]
port=58888

[hotkeys]
; Valid keys:  
; A-Z, 0-9, F1-F12, NUM0-NUM9, NUM_ADD, NUM_SUB
; INSERT, DELETE, HOME (POS1), END, SPACE, TAB, ESCAPE, 
; LEFT, RIGHT, UP, DOWN, PAGEUP, PAGEDOWN,
apply_patch=INSERT
launcher_up_front=HOME
quit_game=END