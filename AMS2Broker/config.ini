[launcher]
; Visibility:
; 0 = Completely invisible
; 1 = Always visible (default)
; 2 = Only visible on errors and after patching (recommended)
silent=1
; Folder with the template files, relative to the launcher.
templates_path=Templates

[game]
; If the Launcher fails finding the EXE: Uncomment the line below and set the right path.
;path_to_exe=C:\Program Files (x86)\Steam\steamapps\common\Automobilista 2\AMS2AVX.exe

[server]
; Try a different port, if the REST-API doesn't respond.
port=58888

[hotkeys]
; Valid keys:  
; A-Z, 0-9, F1-F12, NUM0-NUM9, NUM_ADD, NUM_SUB
; INSERT, DELETE, HOME (POS1), END, SPACE, TAB, ESCAPE, 
; LEFT, RIGHT, UP, DOWN, PAGEUP, PAGEDOWN,
apply_patch=INSERT
launcher_up_front=HOME
quit_game=END